name: Publish approved reel
on:
  workflow_dispatch:
    inputs:
      tag: {description: "Release tag of the approved video", required: true}
      schedule_at: {description: "ISO UTC time, blank = now", required: false}
concurrency: {group: publish, cancel-in-progress: false}
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release download "${{ inputs.tag }}" -D post
          gh release view "${{ inputs.tag }}" --json name --jq .name > post/title.txt
      - env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
          POST_PLATFORMS: ${{ vars.POST_PLATFORMS }}
          IDEMPOTENCY_KEY: ${{ inputs.tag }}
          SCHEDULE_AT: ${{ inputs.schedule_at }}
        run: |
          pip install -q requests
          python3 scripts/post_social.py "$(ls post/*.mp4)" "$(cat post/title.txt)" post/caption.txt "$(ls post/*-cover.jpg)"
